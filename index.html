<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0E14">
<title>Green Earn</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#0B0E14;--card:#161B22;--card2:#1B2229;--bd:#21262D;
--txt:#E6EDF3;--mut:#8B949E;--dim:#6A737D;
--green:#00E676;--gold:#FFB300;--ton:#0088CC;--sol:#9945FF;--red:#FF5252;
--r:18px;
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{padding-bottom:92px;min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hide{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}

.top{position:sticky;top:0;z-index:40;background:rgba(11,14,20,.9);
backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);
padding:calc(env(safe-area-inset-top) + 10px) 0 10px}
.topin{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.3px}
.logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:17px;
background:linear-gradient(140deg,rgba(0,230,118,.18),rgba(0,136,204,.16));
border:1px solid rgba(0,230,118,.28)}
.hicons{display:flex;gap:8px;align-items:center}
.ib{width:36px;height:36px;border-radius:11px;border:1px solid var(--bd);background:var(--card);
display:grid;place-items:center;font-size:15px}
.ib:active{transform:scale(.94)}

.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.g{background:linear-gradient(160deg,rgba(22,27,34,.96),rgba(22,27,34,.74));
backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

.hero{position:relative;overflow:hidden;padding:18px;border-radius:22px;margin:14px 0 12px;
background:linear-gradient(150deg,#12261b 0%,#0f1b22 46%,#161B22 100%);
border:1px solid rgba(0,230,118,.22)}
.hero:after{content:'';position:absolute;width:190px;height:190px;right:-70px;top:-80px;border-radius:50%;
background:radial-gradient(circle,rgba(0,230,118,.3),transparent 68%)}
.hero:before{content:'';position:absolute;width:150px;height:150px;left:-60px;bottom:-80px;border-radius:50%;
background:radial-gradient(circle,rgba(0,136,204,.26),transparent 70%)}
.hlab{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#9fb3a8;font-weight:700;position:relative}
.hbal{font-size:34px;font-weight:800;letter-spacing:-1.4px;margin:5px 0 2px;position:relative;line-height:1.1}
.hbal small{font-size:15px;font-weight:700;color:var(--green);letter-spacing:0}
.hsub{font-size:12px;color:var(--mut);position:relative}
.vip{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:5px 11px;border-radius:999px;
font-size:11.5px;font-weight:700;position:relative;
background:linear-gradient(90deg,rgba(255,179,0,.16),rgba(0,230,118,.13));
border:1px solid rgba(255,179,0,.34);color:#ffd479}
.hrow{display:flex;gap:8px;margin-top:13px;position:relative}
.hstat{flex:1;background:rgba(0,0,0,.28);border:1px solid var(--bd);border-radius:13px;padding:9px 10px}
.hstat b{display:block;font-size:15px;letter-spacing:-.3px}
.hstat span{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);font-weight:700}

.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}
.sec h2{font-size:15px;font-weight:800;margin:0}
.sec small{font-size:11.5px;color:var(--dim);font-weight:600}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--bd);
background:var(--card);font-size:12.5px;font-weight:700;color:var(--mut);white-space:nowrap}
.chip.on{background:rgba(0,230,118,.14);border-color:rgba(0,230,118,.5);color:var(--green)}

.btn{display:block;width:100%;padding:13px 16px;border-radius:14px;font-weight:800;font-size:14px;
text-align:center;border:1px solid transparent;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.975)}
.btn.pri{background:linear-gradient(135deg,#00E676,#00b25e);color:#04160d;
box-shadow:0 10px 26px -14px rgba(0,230,118,.95)}
.btn.gold{background:linear-gradient(135deg,#FFB300,#e09400);color:#221600}
.btn.ghost{background:var(--card2);border-color:var(--bd);color:var(--txt)}
.btn.red{background:rgba(255,82,82,.14);border-color:rgba(255,82,82,.4);color:#ff8a8a}
.btn.sm{padding:9px 12px;font-size:12.5px;border-radius:11px;width:auto;display:inline-block}
.btn[disabled]{opacity:.45;pointer-events:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

.cat{display:flex;gap:13px;align-items:center;padding:15px;border-radius:18px;border:1px solid var(--bd);
background:linear-gradient(140deg,var(--card),var(--card2));margin-bottom:10px;
transition:transform .16s,border-color .16s;position:relative;overflow:hidden}
.cat:active{transform:scale(.98)}
.cat .ci{width:48px;height:48px;flex:0 0 48px;border-radius:14px;display:grid;place-items:center;font-size:23px;
background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.22)}
.cat .cn{font-size:14.5px;font-weight:800;letter-spacing:-.2px}
.cat .cd{font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.4}
.cat .cc{font-size:11px;font-weight:800;color:var(--green);margin-top:4px}
.cat .ar{margin-left:auto;color:var(--dim);font-size:18px}

.co{display:flex;gap:11px;align-items:center;padding:13px;border-radius:16px;border:1px solid var(--bd);
background:var(--card);margin-bottom:9px;transition:transform .16s;position:relative;overflow:hidden}
.co:active{transform:scale(.985)}
.co .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.co .nm{font-size:13.5px;font-weight:800}
.co .tk{font-size:10.5px;color:var(--dim);font-weight:700;letter-spacing:.4px}
.co .rt{margin-left:auto;text-align:right}
.co .rt b{display:block;font-size:15px;font-weight:800;color:var(--green);line-height:1}
.co .rt span{font-size:9px;text-transform:uppercase;color:var(--dim);font-weight:700}
.soon{position:absolute;top:9px;right:9px;font-size:9px;font-weight:800;letter-spacing:.5px;
padding:3px 7px;border-radius:6px;background:rgba(255,179,0,.16);color:#ffca4d;border:1px solid rgba(255,179,0,.3)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(11,14,20,.96);
backdrop-filter:blur(16px);border-top:1px solid var(--bd);
padding:7px 4px calc(env(safe-area-inset-bottom) + 7px)}
.tabsin{display:grid;grid-template-columns:repeat(5,1fr);max-width:640px;margin:0 auto}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;
font-size:9.5px;font-weight:700;color:var(--dim);transition:color .15s}
.tab .ti{font-size:19px;line-height:1;filter:grayscale(1) opacity(.55);transition:filter .15s,transform .15s}
.tab.on{color:var(--green)}
.tab.on .ti{filter:none;transform:translateY(-1px) scale(1.08)}

.sheet{position:fixed;inset:0;z-index:80;display:none}
.sheet.open{display:block}
.sheet .bg{position:absolute;inset:0;background:rgba(5,7,10,.74);backdrop-filter:blur(4px)}
.sheet .pan{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow-y:auto;
background:var(--card);border-top:1px solid var(--bd);border-radius:24px 24px 0 0;
padding:8px 16px calc(env(safe-area-inset-bottom) + 22px);animation:up .26s ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.handle{width:42px;height:4px;border-radius:99px;background:#2b3239;margin:8px auto 14px}
.sheet h3{margin:0 0 4px;font-size:16px;font-weight:800}
.sheet p.sub{margin:0 0 14px;font-size:12px;color:var(--dim)}

.field{margin-bottom:11px}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;
color:var(--dim);font-weight:800;margin-bottom:5px}
.inp,select.inp,textarea.inp{width:100%;background:#0e1319;border:1px solid var(--bd);border-radius:12px;
padding:12px;outline:0;font-size:14px;font-weight:600}
.inp:focus{border-color:rgba(0,230,118,.5);border-width:1px}
textarea.inp{min-height:80px;resize:vertical;font-weight:500;line-height:1.45}

.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;
border-bottom:1px solid rgba(33,38,45,.7);font-size:13px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--mut);font-weight:600}
.kv b{font-weight:800}
.badge{display:inline-block;padding:3px 8px;border-radius:7px;font-size:10px;font-weight:800;
text-transform:uppercase;letter-spacing:.4px}
.badge.p{background:rgba(255,179,0,.15);color:#ffca4d}
.badge.a{background:rgba(0,230,118,.15);color:var(--green)}
.badge.r{background:rgba(255,82,82,.15);color:#ff8a8a}
.note{font-size:11.5px;color:var(--dim);line-height:1.55}
.empty{text-align:center;padding:26px 10px;color:var(--dim);font-size:12.5px}
.empty div{font-size:32px;margin-bottom:8px;opacity:.6}

.tabsbar{display:flex;gap:7px;margin-bottom:12px}
.tabsbar .tb{flex:1;padding:9px;border-radius:11px;background:var(--card2);border:1px solid var(--bd);
font-size:12px;font-weight:800;color:var(--mut);text-align:center}
.tabsbar .tb.on{background:rgba(0,230,118,.14);border-color:rgba(0,230,118,.45);color:var(--green)}
</style>
</head>
<body>

<div class="top"><div class="wrap topin">
  <div class="brand"><div class="logo" id="hlogo">🌱</div><span id="hbrand">Green Earn</span></div>
  <div class="hicons">
    <button class="ib" data-act="lang">🌐</button>
    <button class="ib hide" id="adminbtn" data-act="admin">🛠</button>
  </div>
</div></div>

<div class="wrap" id="app">
  <div class="card" style="margin-top:16px">
    <div style="height:14px;width:60%;border-radius:8px;background:#1b2229;margin-bottom:10px"></div>
    <div style="height:34px;width:45%;border-radius:10px;background:#1b2229;margin-bottom:12px"></div>
    <div style="height:12px;width:80%;border-radius:8px;background:#1b2229"></div>
  </div>
</div>

<div class="tabs"><div class="tabsin" style="grid-template-columns:repeat(6,1fr)">
  <button class="tab on" data-act="tab" data-tab="home"><span class="ti">🏠</span>Home</button>
  <button class="tab" data-act="tab" data-tab="invest"><span class="ti">📈</span>Invest</button>
  <button class="tab" data-act="tab" data-tab="tasks"><span class="ti">✅</span>Tasks</button>
  <button class="tab" data-act="tab" data-tab="team"><span class="ti">🌳</span>Team</button>
  <button class="tab" data-act="tab" data-tab="wallet"><span class="ti">💳</span>Wallet</button>
  <button class="tab" data-act="tab" data-tab="me"><span class="ti">👤</span>Profile</button>
</div></div>

<div class="sheet" id="sh">
  <div class="bg" data-act="close"></div>
  <div class="pan"><div class="handle"></div><div id="shbody"></div></div>
</div>

<div id="errbar" class="hide"></div>
<div id="toast"></div>

<script>

var API = "https://api.telebotcreator.com/new-webhook?data=gAAAAABq45Qjs-fh1QjTsHBU-E52lcu6y5N2YNNgfHN9_gQzORB5ZzLBeAubq2RTfsfXwnGr1MrfzhdjSFEuwfUEj-6QWZZgmaGMO9v3nWRvETDr2GO6Z0rbVFSXZjk382yU6oPc3iT86t-6PnYqCQ_3HaG_ppPmn3bKo_khQFgyKv4gNOqRZkKJ3Gecue4OtnlYNz-Wj_8L";
var BOT = "greenearnevbot";
var TG = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
var INIT = TG && TG.initData ? TG.initData : "";
var ST = {};
ST.cfg = null;
ST.u = null;
ST.tab = "home";
ST.cat = "";
ST.term = "";
ST.co = "";
ST.amt = 0;
ST.pw = "";
ST.adm = null;
ST.admTab = "main";
ST.busy = 0;

function $(id){ return document.getElementById(id); }
function el(tag, cls){ var d = document.createElement(tag); if(cls) d.className = cls; return d; }

function err(text){
  var b = $("errbar");
  if(!b) return;
  b.className = "";
  b.style.cssText = "position:fixed;left:10px;right:10px;top:8px;z-index:9000;background:#2a1416;border:1px solid #FF5252;border-radius:12px;padding:10px 12px;font-size:11px;color:#ffb3b3;line-height:1.5;font-family:monospace;word-break:break-all";
  b.textContent = String(text);
}

window.onerror = function(m, s, l){
  err("Error: " + m + " | line " + l);
  return false;
};

function esc(v){
  var s = v === null || v === undefined ? "" : String(v);
  s = s.split("&").join("&amp;");
  s = s.split("<").join("&lt;");
  s = s.split(">").join("&gt;");
  s = s.split('"').join("&quot;");
  return s;
}
function num(v, d){
  var n = parseFloat(v);
  if(isNaN(n)) n = 0;
  return n.toFixed(d === undefined ? 2 : d);
}
function tap(){
  try{ if(TG && TG.HapticFeedback) TG.HapticFeedback.impactOccurred("medium"); }catch(e){}
}
function buzz(){
  try{ if(TG && TG.HapticFeedback) TG.HapticFeedback.notificationOccurred("warning"); }catch(e){}
}
function say(msg, bad){
  var t = $("toast");
  if(!t) return;
  t.textContent = String(msg);
  t.style.cssText = "position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:9500;padding:11px 16px;border-radius:12px;font-size:12.5px;font-weight:700;max-width:88vw;text-align:center;" +
    "background:" + (bad ? "#3a1a1c" : "#1b2a22") + ";border:1px solid " + (bad ? "rgba(255,82,82,.5)" : "rgba(0,230,118,.45)") + ";color:#fff;transition:opacity .25s";
  t.style.opacity = "1";
  clearTimeout(window._tt);
  window._tt = setTimeout(function(){ t.style.opacity = "0"; }, 2600);
}

function b64(str){
  try{
    var bytes = new TextEncoder().encode(str);
    var bin = "";
    for(var i = 0; i < bytes.length; i++){ bin += String.fromCharCode(bytes[i]); }
    return btoa(bin);
  }catch(e){
    try{ return btoa(unescape(encodeURIComponent(str))); }catch(e2){ return str; }
  }
}

function api(action, data, cb){
  if(!API || API.indexOf("http") !== 0){
    err("API address missing in the file");
    if(cb) cb({ok:false, e:"API address missing"});
    return;
  }
  var inner = {};
  inner["a"] = action;
  inner["init"] = INIT;
  inner["d"] = data || {};
  var payload;
  try{
    var outer = {};
    outer["p"] = b64(JSON.stringify(inner));
    payload = JSON.stringify(outer);
  }catch(e){ payload = JSON.stringify(inner); }

  var finished = 0;
  var stop = setTimeout(function(){
    if(finished) return;
    finished = 1;
    if(cb) cb({ok:false, e:"The server took too long. Try again."});
  }, 45000);

  fetch(API, {method:"POST", headers:{"Content-Type":"application/json"}, body:payload})
    .then(function(r){ return r.text(); })
    .then(function(txt){
      if(finished) return;
      finished = 1;
      clearTimeout(stop);
      var raw = null;
      try{ raw = JSON.parse(txt); }catch(e){ raw = null; }
      if(!raw || typeof raw !== "object"){
        if(cb) cb({ok:false, e:"Unexpected answer from the server."});
        return;
      }
      var res = raw;
      if(raw.result !== undefined && raw.result !== null){
        if(typeof raw.result === "string"){
          try{ res = JSON.parse(raw.result); }catch(e){ res = raw; }
        }else if(typeof raw.result === "object"){
          res = raw.result;
        }
      }
      if(!res || typeof res !== "object"){ res = {}; }
      if(!res.ok && !res.e){ res.e = "Request refused."; }
      if(cb) cb(res);
    })
    .catch(function(){
      if(finished) return;
      finished = 1;
      clearTimeout(stop);
      if(cb) cb({ok:false, e:"Network error. Check your connection."});
    });
}

function applyUser(u){
  if(!u) return;
  ST.u = u;
  var b = $("adminbtn");
  if(b){
    if(u.is_admin === 1) b.classList.remove("hide");
    else b.classList.add("hide");
  }
}

function refresh(u){
  applyUser(u);
  draw();
}

function act(action, data, okMsg){
  if(ST.busy) return;
  ST.busy = 1;
  api(action, data, function(j){
    ST.busy = 0;
    if(!j.ok){
      buzz();
      say(j.e || "Something went wrong", true);
      return;
    }
    if(j.r && j.r.u) refresh(j.r.u);
    if(j.r && j.r.msg) say(j.r.msg);
    else if(okMsg) say(okMsg);
    if(j.r && j.r.onDone) draw();
  });
}

function boot(){
  if(TG){
    try{ TG.ready(); }catch(e){}
    try{ TG.expand(); }catch(e){}
    try{ TG.setHeaderColor("#0B0E14"); }catch(e){}
    try{ TG.setBackgroundColor("#0B0E14"); }catch(e){}
  }
  if(!INIT){
    fatal("Open this app from inside Telegram. Go back to the bot chat and tap the button again.");
    return;
  }
  var d = {};
  api("boot", d, function(j){
    if(!j.ok){ fatal(j.e || "Could not load your account."); return; }
    if(!j.r || !j.r.cfg || !j.r.u){ fatal("The server sent an incomplete answer."); return; }
    ST.cfg = j.r.cfg;
    applyUser(j.r.u);
    if(!ST.term && ST.cfg.terms && ST.cfg.terms.length){ ST.term = ST.cfg.terms[2] ? ST.cfg.terms[2].id : ST.cfg.terms[0].id; }
    if(!ST.cat && ST.cfg.cats && ST.cfg.cats.length){ ST.cat = ST.cfg.cats[0].id; }
    draw();
  });
}

function fatal(msg){
  var a = $("app");
  if(!a) return;
  a.innerHTML = "<div class='card' style='margin-top:40px;text-align:center;padding:26px'>" +
    "<div style='font-size:40px;margin-bottom:12px'>🔒</div>" +
    "<div style='font-size:15px;font-weight:800;margin-bottom:8px'>Cannot open the app</div>" +
    "<div class='note'>" + esc(msg) + "</div></div>";
}

document.addEventListener("click", function(ev){
  var n = ev.target;
  var node = null;
  while(n && n !== document.body){
    if(n.getAttribute && n.getAttribute("data-act")){ node = n; break; }
    n = n.parentNode;
  }
  if(!node) return;
  var a = node.getAttribute("data-act");
  tap();
  try{
    route(a, node);
  }catch(e){
    err("Click error: " + (e && e.message ? e.message : e));
  }
});

function route(a, node){
  var v = node.getAttribute("data-v");
  if(a === "tab"){ ST.tab = v; ST.co = ""; draw(); return; }
  if(a === "cat"){ ST.cat = v; ST.co = ""; draw(); return; }
  if(a === "co"){ ST.co = v; ST.amt = 0; draw(); return; }
  if(a === "back"){ ST.co = ""; draw(); return; }
  if(a === "term"){ ST.term = v; draw(); return; }
  if(a === "daily"){ api("daily", {}, afterGain); return; }
  if(a === "box"){ api("box", {id:v}, afterGain); return; }
  if(a === "invest"){ doInvest(); return; }
  if(a === "task"){ doTask(v); return; }
  if(a === "lang"){ openLang(); return; }
  if(a === "setlang"){ api("lang", {lang:v}, function(j){ if(j.ok){ closeSheet(); refresh(j.r.u); } else buzz(); }); return; }
  if(a === "wallet"){ openWallet(); return; }
  if(a === "deposit"){ openDeposit(); return; }
  if(a === "depnew"){ doDeposit(); return; }
  if(a === "proof"){ openProof(v); return; }
  if(a === "proofsend"){ doProof(v); return; }
  if(a === "withdraw"){ openWithdraw(); return; }
  if(a === "wdnew"){ doWithdraw(); return; }
  if(a === "profile"){ openProfile(); return; }
  if(a === "profilesave"){ doProfile(); return; }
  if(a === "kyc"){ openKyc(); return; }
  if(a === "kycsave"){ doKyc(); return; }
  if(a === "history"){ openHistory(); return; }
  if(a === "close"){ closeSheet(); return; }
  if(a === "admin"){ openAdmin(); return; }
  if(a === "admlogin"){ doAdminLogin(); return; }
  if(a === "admtab"){ ST.admTab = v; renderAdmin(); return; }
  if(a === "admsave"){ adminSave(node); return; }
  if(a === "admecon"){ adminEcon(node); return; }
  if(a === "admadd"){ adminAdd(v); return; }
  if(a === "admdel"){ adminDel(v); return; }
  if(a === "admdecide"){ adminDecide(node); return; }
  if(a === "admuser"){ adminUser(); return; }
  if(a === "admbal"){ adminBal(node); return; }
  if(a === "copy"){ doCopy(v); return; }
  if(a === "share"){ doShare(); return; }
  if(a === "chan"){ openLink(ST.cfg.channel); return; }
}

function openHistory(){
  var h = "<h3>📜 History</h3><p class='sub'>All wallet movements</p>";
  h += txRows(40);
  var deps = ST.u.deps || [];
  h += "<div class='sec'><h2>Deposits</h2></div>";
  if(deps.length === 0) h += "<div class='note'>None.</div>";
  for(var i = 0; i < deps.length; i++){
    var d = deps[i];
    var st = d.status === "approved" ? "<span class='badge a'>approved</span>" :
      (d.status === "rejected" ? "<span class='badge r'>rejected</span>" : "<span class='badge p'>pending</span>");
    h += "<div class='kv'><span>" + esc(d.id) + " · " + esc(d.wname || "") + "</span><b>" + num(d.amount) + " " + st + "</b></div>";
  }
  var wd = ST.u.wds || [];
  h += "<div class='sec'><h2>Withdrawals</h2></div>";
  if(wd.length === 0) h += "<div class='note'>None.</div>";
  for(var k = 0; k < wd.length; k++){
    var w = wd[k];
    var s2 = w.status === "paid" ? "<span class='badge a'>paid</span>" :
      (w.status === "rejected" ? "<span class='badge r'>rejected</span>" : "<span class='badge p'>pending</span>");
    h += "<div class='kv'><span>" + esc(w.id) + " · " + esc(w.method || "") + "</span><b>" + num(w.amount) + " " + s2 + "</b></div>";
  }
  openSheet(h);
}

function openDeposit(){
  var wl = ST.cfg.wallets || [];
  var h = "<h3>📥 Deposit</h3><p class='sub'>Choose a payment method, send, then upload proof</p>";
  if(wl.length === 0){ openSheet(h + "<div class='note'>No method configured yet.</div>"); return; }
  h += "<div class='field'><label>Payment method</label><select class='inp' id='dmethod'>";
  for(var i = 0; i < wl.length; i++){
    if(parseInt(wl[i].active || 1) !== 1) continue;
    h += "<option value='" + esc(wl[i].id) + "'>" + esc(wl[i].name) + "</option>";
  }
  h += "</select></div>";
  h += "<div class='field'><label>Amount (USDT)</label><input class='inp' id='damount' type='number' inputmode='decimal' value='" + num(ST.cfg.min_deposit) + "'></div>";
  h += "<button class='btn pri' data-act='depnew'>Continue</button>";
  h += "<div class='note' style='margin-top:10px'>Minimum " + num(ST.cfg.min_deposit) + " USDT. Your balance is credited after an admin confirms your proof.</div>";
  openSheet(h);
}

function doDeposit(){
  var m = $("dmethod");
  var a = $("damount");
  if(!m || !a) return;
  var d = {};
  d["wid"] = m.value;
  d["amount"] = parseFloat(a.value || 0);
  api("dep_new", d, function(j){
    if(!j.ok){ buzz(); say(j.e || "Failed", true); return; }
    var h = "<h3>Send your deposit</h3><p class='sub'>" + esc(j.r.wname) + " · " + num(j.r.amount !== undefined ? j.r.amount : 0) + "</p>";
    h += "<div class='card' style='border-color:rgba(0,230,118,.4)'>" +
      "<div class='note'>Send the exact amount to this address</div>" +
      "<div style='font-family:monospace;font-size:12px;word-break:break-all;margin:7px 0'>" + esc(j.r.addr) + "</div>" +
      "<button class='btn ghost sm' data-act='copy' data-v='" + esc(j.r.addr) + "'>Copy address</button></div>";
    h += "<div class='card'><div class='note'>After sending, tap below and paste your transaction hash. You can also send the screenshot to the bot chat.</div>" +
      "<button class='btn pri' style='margin-top:9px' data-act='proof' data-v='" + esc(j.r.id) + "'>I have paid</button></div>";
    openSheet(h);
    if(j.r.u) refresh(j.r.u);
  });
}

  var d = {};

    say("Proof sent for review");
    closeSheet();
    if(j.r.u) refresh(j.r.u);

}

  var tabs = [["main", "Economy"], ["cats", "Sections"], ["plans", "Companies"], ["terms", "Terms"], ["events", "News"], ["tasks", "Tasks"], ["wallets", "Payments"], ["boxes", "Boxes"], ["vip", "VIP"], ["review", "Review"], ["users", "Users"]];

  h += "<div class='chips' style='padding-bottom:10px'>";

    h += "<button class='chip" + on + "' data-act='admtab' data-v='" + tabs[i][0] + "'>" + tabs[i][1] + "</button>";

function fid(kind, id, field){ return "f_" + kind + "_" + id + "_" + field; }

function admField(kind, id, field, label, value, isNum){
  var iid = fid(kind, id, field);
  return "<div class='field'><label>" + esc(label) + "</label>" +
    "<input class='inp' id='" + esc(iid) + "' type='" + (isNum ? "number" : "text") + "' value='" + esc(value) + "'></div>";
}

function admSaveBtn(kind, id){
  return "<button class='btn pri sm' data-act='admsave' data-dk='" + esc(kind) + "' data-di='" + esc(id) + "' data-fields='1'>Save</button>";
}

function readField(kind, id, field){
  var e = $(fid(kind, id, field));
  if(!e) return "";
  return e.value;
}

function admList(kind, title, key, fields){
  var lst = ST.adm[key] || [];
  var h = "<div class='sec'><h2>" + esc(title) + "</h2><small>" + lst.length + " items</small></div>";
  var labels = {};
  labels["name"] = "Name";
  labels["emoji"] = "Emoji";
  labels["desc"] = "Description";
  labels["label"] = "Label";
  labels["days"] = "Days";
  labels["title"] = "Title";
  labels["text"] = "Text";
  labels["img"] = "Image URL";
  labels["url"] = "Link";
  labels["reward"] = "Reward USDT";
  labels["need"] = "Needed count";
  labels["address"] = "Address";
  labels["note"] = "Note";
  labels["min"] = "Minimum USDT";
  labels["max"] = "Maximum USDT";
  for(var i = 0; i < lst.length; i++){
    var r = lst[i];
    h += "<div class='card'>";
    h += "<div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:8px'>" +

function adminSave(node){
  var kind = node.getAttribute("data-dk");
  var id = node.getAttribute("data-di");
  var payload = {};
  payload["pw"] = ST.pw;
  payload["kind"] = kind;
  payload["id"] = id;
  if(kind === "plan"){
    var terms = ST.cfg.terms || [];
    for(var t = 0; t < terms.length; t++){
      payload["y:" + terms[t].id] = readField("plan", id, "y:" + terms[t].id);
    }
    var simple = ["name", "ticker", "desc", "min", "soon", "cat"];
    for(var i = 0; i < simple.length; i++){ payload[simple[i]] = readField("plan", id, simple[i]); }
  }else{
    var flds = [];
    if(kind === "cat") flds = ["name", "emoji", "desc"];
    else if(kind === "term") flds = ["label", "days"];
    else if(kind === "event") flds = ["title", "text", "img"];
    else if(kind === "task") flds = ["title", "desc", "url", "reward", "need"];
    else if(kind === "wallet") flds = ["name", "address", "note"];
    else if(kind === "box") flds = ["name", "emoji", "min", "max"];
    else if(kind === "vip") flds = ["name", "min"];
    for(var k = 0; k < flds.length; k++){ payload[flds[k]] = readField(kind, id, flds[k]); }
  }
  api("admin_set", payload, function(j){
    if(!j.ok){ buzz(); say(j.e || "Failed", true); return; }
    say("Saved");
    admReload();
  });
}

  d["id"] = "";
  api("admin_del", d, function(j){
    if(!j.ok){ buzz(); say(j.e || "Failed", true); return; }
    say("Removed");
    admReload();
  });
}

function admReview(){
  var h = "";
  var deps = ST.adm.deps || [];
  h += "<div class='sec'><h2>📥 Deposits</h2><small>" + deps.length + "</small></div>";
  if(deps.length === 0) h += "<div class='card'><div class='note'>None waiting.</div></div>";
  for(var i = 0; i < deps.length; i++){
    var d = deps[i];
    h += "<div class='card'><div style='display:flex;justify-content:space-between'>" +
      "<div><div style='font-size:12px;font-weight:800'>" + num(d.amount) + " USDT</div>" +
      "<div class='note'>user " + esc(d.u) + " · " + esc(d.wname || "") + "</div>" +
      (d.proof ? "<div class='note' style='word-break:break-all'>proof: " + esc(d.proof) + "</div>" : "<div class='note'>no proof yet</div>") +
      "</div><span class='badge p'>" + esc(d.id) + "</span></div>" +
      "<div class='row2' style='margin-top:9px'>" +
      "<button class='btn pri sm' style='width:100%' data-act='admdecide' data-dk='dep' data-di='" + esc(d.id) + "' data-ok='1'>Approve</button>" +
      "<button class='btn red sm' style='width:100%' data-act='admdecide' data-dk='dep' data-di='" + esc(d.id) + "' data-ok='0'>Reject</button></div></div>";
  }
  var wds = ST.adm.wds || [];
  h += "<div class='sec'><h2>📤 Withdrawals</h2><small>" + wds.length + "</small></div>";
  if(wds.length === 0) h += "<div class='card'><div class='note'>None waiting.</div></div>";
  for(var k = 0; k < wds.length; k++){
    var w = wds[k];
    h += "<div class='card'><div style='display:flex;justify-content:space-between'>" +
      "<div><div style='font-size:12px;font-weight:800'>" + num(w.amount) + " USDT</div>" +
      "<div class='note'>user " + esc(w.u) + " · net " + num(w.net) + "</div>" +
      "<div class='note'>" + esc(w.method || "") + "</div>" +
      "<div class='note' style='word-break:break-all'>" + esc(w.addr || "") + "</div></div>" +
      "<span class='badge p'>" + esc(w.id) + "</span></div>" +
      "<div class='row2' style='margin-top:9px'>" +
      "<button class='btn pri sm' style='width:100%' data-act='admdecide' data-dk='wd' data-di='" + esc(w.id) + "' data-ok='1'>Paid</button>" +
      "<button class='btn red sm' style='width:100%' data-act='admdecide' data-dk='wd' data-di='" + esc(w.id) + "' data-ok='0'>Reject</button></div></div>";
  }
  var ks = ST.adm.kycs || [];
  h += "<div class='sec'><h2>🛡 ID checks</h2><small>" + ks.length + "</small></div>";
  if(ks.length === 0) h += "<div class='card'><div class='note'>None waiting.</div></div>";
  for(var z = 0; z < ks.length; z++){
    var y = ks[z];
    h += "<div class='card'><div style='font-size:12px;font-weight:800'>" + esc(y.name) + "</div>" +
      "<div class='note'>user " + esc(y.u) + " · ID " + esc(y.idnum) + "</div>" +
      "<div class='row2' style='margin-top:9px'>" +
      "<button class='btn pri sm' style='width:100%' data-act='admdecide' data-dk='kyc' data-di='" + esc(y.id) + "' data-ok='1'>Verify</button>" +
      "<button class='btn red sm' style='width:100%' data-act='admdecide' data-dk='kyc' data-di='" + esc(y.id) + "' data-ok='0'>Reject</button></div></div>";
  }
  return h;
}

function adminDecide(node){
  var d = {};
  d["pw"] = ST.pw;
  d["kind"] = node.getAttribute("data-dk");
  d["id"] = node.getAttribute("data-di");
  d["ok"] = parseInt(node.getAttribute("data-ok") || "0");
  api("admin_decide", d, function(j){
    if(!j.ok){ buzz(); say(j.e || "Failed", true); return; }
    say("Done");
    admReload();
  });
}

function admUsers(){
  var h = "<div class='sec'><h2>👤 Find user</h2></div>";
  h += "<div class='field'><label>Username or numeric id</label><input class='inp' id='uq' placeholder='@username or 123456789'></div>";
  h += "<div class='row2'><button class='btn ghost' data-act='admuser'>Look up</button>" +
    "<button class='btn ghost' data-act='admbal' data-sign='1'>Credit</button></div>";
  h += "<div class='field' style='margin-top:10px'><label>Amount for credit / debit</label>" +
    "<input class='inp' id='uamt' type='number' placeholder='10'></div>";
  h += "<button class='btn red' data-act='admbal' data-sign='-1' style='margin-top:8px'>Debit user</button>";
  h += "<div id='uout' style='margin-top:12px'></div>";
  return h;
}

function adminUser(){
  var q = $("uq");
  if(!q) return;
  var d = {};
  d["pw"] = ST.pw;
  d["q"] = q.value;
  api("admin_user", d, function(j){
    if(!j.ok){ buzz(); say(j.e || "Not found", true); return; }
    var u = j.r.usr;
    var h = "<div class='card'><div style='font-size:12.5px;font-weight:800'>User " + esc(u.uid) + "</div>" +
      "<div class='kv'><span>Balance</span><b>" + num(u.bal) + "</b></div>" +
      "<div class='kv'><span>Invested</span><b>" + num(u.invest) + "</b></div>" +
      "<div class='kv'><span>Team</span><b>" + (u.c1 + u.c2 + u.c3) + "</b></div>" +
      "<div class='kv'><span>Verification</span><b>" + esc(u.kyc) + "</b></div>" +
      "<div class='kv'><span>Joined</span><b>" + esc((u.tx || []).length) + " tx</b></div></div>";
    var o = $("uout");
    if(o) o.innerHTML = h;
  });
}

function adminBal(node){
  var q = $("uq");
  var a = $("uamt");
  if(!q || !a) return;
  var sign = parseInt(node.getAttribute("data-sign") || "1");
  var d = {};
  d["pw"] = ST.pw;
  d["q"] = q.value;
  d["amount"] = sign * Math.abs(parseFloat(a.value || 0));
  api("admin_bal", d, function(j){
    if(!j.ok){ buzz(); say(j.e || "Failed", true); return; }
    say("New balance " + num(j.r.bal));
    admReload();
  });
}

var routeBase = route;
route = function(a, node){
  if(a === "howto"){ openHowto(); return; }
  if(a === "admdel"){
    var dk = node.getAttribute("data-dk");
    var di = node.getAttribute("data-di");
    var d = {};
    d["pw"] = ST.pw;
    d["kind"] = dk;
    d["id"] = di;
    api("admin_del", d, function(j){
      if(!j.ok){ buzz(); say(j.e || "Failed", true); return; }
      say("Removed");
      admReload();
    });
    return;
  }
  if(a === "amt"){ return; }
  routeBase(a, node);
};

document.addEventListener("input", function(ev){
  var n = ev.target;
  if(!n || !n.getAttribute) return;
  var a = n.getAttribute("data-act");
  if(a !== "amt") return;
  var v = parseFloat(n.value || 0);
  if(isNaN(v)) v = 0;
  ST.amt = v;
  var p = null;
  var pl = ST.cfg.plans || [];
  for(var i = 0; i < pl.length; i++){ if(pl[i].id === ST.co) p = pl[i]; }
  if(!p) return;
  var rate = parseFloat((p.yields || {})[ST.term] || 0);
  var days = 1;
  var ts = ST.cfg.terms || [];
  for(var k = 0; k < ts.length; k++){ if(ts[k].id === ST.term) days = parseInt(ts[k].days || 1); }
  var pd = $("pday");
  var pt = $("ptot");
  if(pd) pd.textContent = num(v * rate / 100) + " USDT";
  if(pt) pt.textContent = num(v * rate / 100 * days) + " USDT";
});

document.addEventListener("DOMContentLoaded", function(){
  try{ boot(); }catch(e){ err("Boot error: " + (e && e.message ? e.message : e)); }
});

if(document.readyState === "complete" || document.readyState === "interactive"){
  setTimeout(function(){ try{ boot(); }catch(e){ err("Boot error: " + (e && e.message ? e.message : e)); } }, 0);
}

setInterval(function(){
  var b = $("adminbtn");
  if(b && ST.u){
    if(ST.u.is_admin === 1) b.classList.remove("hide");
    else b.classList.add("hide");
  }
}, 1500);
</script>
